<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Ирландия">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ирландия · 30 сен – 10 окт</title>
<style>
:root{
  --paper:#EFF1EC;
  --card:#FBFBF8;
  --ink:#16241D;
  --ink-soft:#4A5A50;
  --moss:#3D5A48;
  --water:#2E6B87;
  --gorse:#E0A31C;
  --rule:#CBD2C7;
  --rule-soft:#E1E5DD;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:400;margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---- gate ---- */
#gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;box-sizing:border-box;
}
#gate form{width:100%;max-width:320px;text-align:center}
#gate h1{font-size:30px;margin:0 0 6px}
#gate p{margin:0 0 20px;color:var(--ink-soft);font-size:14px}
#gate input{
  width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:12px 14px;
  border:1px solid var(--rule);border-radius:4px;background:#fff;
}
#gate button{
  width:100%;margin-top:10px;font:inherit;font-weight:600;padding:12px;
  border:0;border-radius:4px;background:var(--ink);color:var(--paper);
}
#gate-err{color:#A8432A;font-size:14px;min-height:21px;margin-top:10px}
#app[hidden], #gate[hidden]{display:none}

/* ---- top ---- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:calc(10px + env(safe-area-inset-top)) 0 0;
}
.brand{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 18px 8px;
}
.brand h1{font-size:19px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--ink-soft)}
.days{
  display:flex;gap:6px;overflow-x:auto;padding:2px 14px 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.days::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-width:52px;padding:7px 9px 8px;border:1px solid var(--rule);
  border-radius:3px;background:transparent;cursor:pointer;text-align:center;
  font:inherit;color:var(--ink-soft);line-height:1.15;
}
.chip b{display:block;font-size:16px;font-weight:600;color:var(--ink)}
.chip small{font-size:10px;letter-spacing:.4px}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink)}
.chip[aria-selected="true"] b,.chip[aria-selected="true"] small{color:var(--paper)}
.chip.today::after{
  content:"";display:block;width:5px;height:5px;border-radius:50%;
  background:var(--gorse);margin:4px auto 0;
}

/* ---- layout ---- */
main{padding:16px 18px 8px;max-width:640px;margin:0 auto}
.hero{
  background:var(--ink);color:var(--paper);border-radius:4px;
  padding:20px 18px;margin-bottom:20px;
}
.hero .big{font-family:Georgia,serif;font-size:44px;line-height:1;display:block}
.hero .lede{font-size:14px;color:#B9C6BC;margin-top:8px}
.hero em{font-style:normal;color:var(--gorse)}

.dayhead{margin-bottom:14px}
.dayhead h2{font-size:26px;line-height:1.15}
.dayhead p{margin:5px 0 0;font-size:13.5px;color:var(--ink-soft)}
.tag{
  display:inline-block;font-size:11px;letter-spacing:.5px;padding:3px 7px;
  border-radius:2px;margin-bottom:9px;color:#fff;
}
.tag.move{background:var(--water)}
.tag.tour{background:var(--moss)}
.tag.city{background:#7A6A55}

.stop{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--rule-soft)}
.stop:first-of-type{border-top:0}
.t{flex:0 0 48px;font-size:14px;font-weight:600;color:var(--moss);padding-top:1px}
.t.none{color:var(--rule)}
.stop .body{flex:1;min-width:0}
.stop h3{font-size:16.5px;line-height:1.3}
.stop p{margin:4px 0 0;font-size:14px;color:var(--ink-soft)}
.ticket{
  background:#fff;border:1px solid var(--rule);border-radius:4px;
  padding:14px 12px 12px;margin-top:10px;text-align:center;cursor:pointer;
}
.ticket img{width:100%;height:88px;display:block;image-rendering:pixelated}
.ticket span{display:block;margin-top:8px;font-size:12px;color:var(--ink-soft)}
#zoom{
  position:fixed;inset:0;z-index:99;background:#fff;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:18px;
}
#zoom.on{display:flex}
#zoom img{width:96%;height:auto;max-height:42vh;image-rendering:pixelated}
#zoom p{margin:0;font-size:14px;color:#444;text-align:center}
.ref{
  display:inline-block;margin-top:5px;font-size:14px;font-weight:600;
  letter-spacing:.6px;color:var(--ink);background:rgba(224,163,28,.22);
  padding:2px 7px;border-radius:2px;font-variant-numeric:tabular-nums;
}
.map{
  display:block;margin-top:7px;font-size:13px;text-decoration:none;
  color:var(--water);border-bottom:1px solid rgba(46,107,135,.35);padding-bottom:1px;
  width:fit-content;
}
.map::before{content:"◎ ";font-size:11px}
.book{
  display:block;margin-top:7px;font-size:13px;text-decoration:none;
  color:var(--moss);border-bottom:1px solid rgba(61,90,72,.35);padding-bottom:1px;
  width:fit-content;
}
.book::before{content:"↗ ";font-size:11px}
.stop.go{background:linear-gradient(90deg,rgba(46,107,135,.07),transparent);
  border-radius:3px;padding-left:9px;margin-left:-9px}
.stop.go h3{color:var(--water)}
.stop.book h3::after{content:" ✓";color:var(--moss);font-size:13px}

.panel{
  background:var(--card);border:1px solid var(--rule-soft);border-radius:4px;
  padding:14px 15px;margin-top:16px;
}
.panel h3{font-size:14px;color:var(--moss);margin-bottom:7px}
.panel p{margin:0;font-size:14px;color:var(--ink-soft)}
.panel + .panel{margin-top:10px}

/* ---- lists ---- */
.row{
  display:flex;gap:12px;align-items:flex-start;padding:13px 0;
  border-top:1px solid var(--rule-soft);
}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row h3{font-size:15.5px}
.row p{margin:3px 0 0;font-size:13.5px;color:var(--ink-soft)}
.price{font-size:15px;font-weight:600;white-space:nowrap;padding-top:1px}
.box{
  flex:0 0 22px;height:22px;margin-top:1px;border:1.5px solid var(--rule);
  border-radius:3px;background:transparent;cursor:pointer;padding:0;
  font-size:13px;color:var(--paper);line-height:19px;
}
.box[aria-pressed="true"]{background:var(--moss);border-color:var(--moss)}
.done h3{text-decoration:line-through;text-decoration-color:var(--rule)}
.done h3,.done .price{color:var(--ink-soft)}
.urgent .price{color:#A8432A}

.total{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--ink);margin-top:14px;padding-top:11px;
}
.total span{font-size:14px;color:var(--ink-soft)}
.total b{font-size:22px;font-family:Georgia,serif;font-weight:400}

.sec{margin:26px 0 10px;font-size:13px;color:var(--ink-soft)}

/* ---- bottom nav ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  background:none;border:0;font:inherit;font-size:12.5px;color:var(--ink-soft);
  padding:13px 4px 14px;cursor:pointer;border-top:2px solid transparent;margin-top:-1px;
}
nav button[aria-current="true"]{color:var(--ink);font-weight:600;border-top-color:var(--gorse)}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  main>section{animation:in .18s ease-out}
  @keyframes in{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>

<div id="gate">
  <form id="gate-form">
    <h1>Ирландия</h1>
    <p>Введите пароль. Телефон запомнит его, вводить нужно один раз.</p>
    <input id="gate-pw" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <button type="submit">Открыть</button>
    <div id="gate-err"></div>
  </form>
</div>

<div id="app" hidden>
<header>
  <div class="brand">
    <h1>Ирландия</h1>
    <span id="stamp"></span>
  </div>
  <div class="days" id="days" role="tablist"></div>
</header>

<main id="main"></main>

<div id="zoom" role="dialog" aria-label="Билеты в Килмэнхем">
  <p>Яркость на максимум. Тап — закрыть.</p>
</div>

<nav>
  <button data-view="day" aria-current="true">Дни</button>
  <button data-view="book">Брони</button>
  <button data-view="stay">Жильё</button>
  <button data-view="note">Памятка</button>
</nav>
</div>

let DAYS, TICKETS, BOOK, STAY, NOTES;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORAGE = "ireland-key";

async function deriveKey(password, saltB64, iterations){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(saltB64), iterations, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]
  );
}

async function decryptWithKey(key){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.data));
  const src = new TextDecoder().decode(plain);
  const built = new Function(src + "\nreturn {DAYS,TICKETS,BOOK,STAY,NOTES};")();
  DAYS = built.DAYS; TICKETS = built.TICKETS; BOOK = built.BOOK; STAY = built.STAY; NOTES = built.NOTES;
}

async function unlock(){
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  initApp();
}

(async () => {
  let savedKeyRaw = null;
  try { savedKeyRaw = localStorage.getItem(KEY_STORAGE); } catch(e){}
  if (savedKeyRaw){
    try {
      const key = await crypto.subtle.importKey("raw", b64(savedKeyRaw), "AES-GCM", false, ["decrypt"]);
      await decryptWithKey(key);
      await unlock();
      return;
    } catch(e){ try { localStorage.removeItem(KEY_STORAGE); } catch(_){} }
  }
  const form = document.getElementById("gate-form");
  form.onsubmit = async ev => {
    ev.preventDefault();
    const err = document.getElementById("gate-err");
    err.textContent = "Проверяю…";
    try {
      const key = await deriveKey(document.getElementById("gate-pw").value, ENC.salt, ENC.iter);
      await decryptWithKey(key);
      try {
        const raw = await crypto.subtle.exportKey("raw", key);
        localStorage.setItem(KEY_STORAGE, btoa(String.fromCharCode(...new Uint8Array(raw))));
      } catch(e){}
      err.textContent = "";
      await unlock();
    } catch(e){
      err.textContent = "Неверный пароль";
    }
  };
})();

/* ---------- приложение (запускается после разблокировки) ---------- */
function initApp(){

const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const APPLE = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);
function mapLink(addr, label){
  if (!addr) return "";
  const q = encodeURIComponent(addr);
  const url = APPLE ? `https://maps.apple.com/?q=${q}` : `https://maps.google.com/?q=${q}`;
  return `<a class="map" href="${url}" target="_blank" rel="noopener">${esc(label || addr)}</a>`;
}

const T0 = new Date("2026-09-30T00:00:00");
const today = new Date();
const iso = today.toISOString().slice(0,10);
let idx = Math.max(0, DAYS.findIndex(d => d.date === iso));
if (DAYS.findIndex(d => d.date === iso) === -1) idx = 0;
let view = "day";
let checked = {};

const CKEY = "ireland-booked";
try { const v = localStorage.getItem(CKEY); if (v) checked = JSON.parse(v); } catch(e){}
function persist(){ try { localStorage.setItem(CKEY, JSON.stringify(checked)); } catch(e){} }

const daysLeft = Math.ceil((T0 - today) / 864e5);

const chips = document.getElementById("days");
DAYS.forEach((d,i) => {
  const b = document.createElement("button");
  b.className = "chip" + (d.date === iso ? " today" : "");
  b.setAttribute("role","tab");
  b.innerHTML = `<b class="num">${d.d}</b><small>${d.m}</small>`;
  b.onclick = () => { idx = i; view = "day"; syncNav(); render(); };
  chips.appendChild(b);
});
document.getElementById("stamp").textContent =
  daysLeft > 0 ? `через ${daysLeft} дн.` : "в пути";

const navBtns = [...document.querySelectorAll("nav button")];
navBtns.forEach(b => b.onclick = () => { view = b.dataset.view; syncNav(); render(); });
function syncNav(){
  navBtns.forEach(b => b.setAttribute("aria-current", String(b.dataset.view === view)));
}

const main = document.getElementById("main");

function render(){
  [...chips.children].forEach((c,i) =>
    c.setAttribute("aria-selected", String(view === "day" && i === idx)));
  main.innerHTML = "<section>" +
    ({day:dayView, book:bookView, stay:stayView, note:noteView}[view])() + "</section>";
  bindBoxes();
  window.scrollTo({top:0});
}

function dayView(){
  const d = DAYS[idx];
  const kindName = {city:"город", move:"переезд", tour:"день-тур"}[d.kind];
  let h = "";
  if (idx === 0 && daysLeft > 0){
    const left = BOOK.filter(b => !b.done && !checked[b.n]).length;
    h += `<div class="hero"><span class="big num">${daysLeft}</span>
      <div class="lede">дней до вылета. Осталось забронировать <em>${left}</em> ${plural(left)}.</div></div>`;
  }
  h += `<div class="dayhead"><span class="tag ${d.kind}">${kindName}</span>
    <h2>${esc(d.title)}</h2><p>${d.wd}, ${d.d} ${d.m.toLowerCase()} · ${esc(d.sub)}</p></div>`;
  h += d.stops.map(s => `
    <div class="stop${s.go?" go":""}${s.book?" book":""}">
      <div class="t${s.t?"":" none"}">${s.t || "—"}</div>
      <div class="body"><h3>${esc(s.n)}</h3>${s.p?`<p>${esc(s.p)}</p>`:""}${s.url?`<a class="book" href="${esc(s.url)}" target="_blank" rel="noopener">Забронировать</a>`:""}${mapLink(s.a)}</div>
    </div>`).join("");
  if (d.trans) h += panel("Дорога и мелочи", d.trans);
  if (d.eve)   h += panel("Вечером", d.eve, d.eveA);
  if (d.wear)  h += panel("Что надеть", d.wear);
  if (d.date === "2026-10-02"){
    h += `<div class="panel"><h3>Билеты</h3><p>${esc(TICKETS.sub)}</p></div>`;
    h += TICKETS.imgs.map((src,i) => `<div class="ticket" data-t="${i}">
      <img src="${src}" alt="Штрихкод, билет ${i+1}">
      <span>Билет ${i+1} · тап, чтобы увеличить</span></div>`).join("");
  }
  return h;
}
const panel = (t,b,a) => `<div class="panel"><h3>${t}</h3><p>${esc(b)}</p>${mapLink(a)}</div>`;
const plural = n => (n%10===1 && n%100!==11) ? "штуку" : "штук";

function bookView(){
  const paid = BOOK.filter(b => b.done || checked[b.n]).reduce((s,b)=>s+b.p,0);
  const all  = BOOK.reduce((s,b)=>s+b.p,0);
  let h = `<div class="dayhead"><h2>Что бронировать</h2>
    <p>Цены на двоих. Номер брони — жёлтым. Отмечайте галочкой, что уже куплено.</p></div>`;
  h += BOOK.map((b,i) => {
    const on = b.done || !!checked[b.n];
    return `<div class="row${on?" done":""}${b.urgent&&!on?" urgent":""}">
      <button class="box" data-i="${i}" aria-pressed="${on}" aria-label="Куплено">${on?"✓":""}</button>
      <div class="grow"><h3>${esc(b.n)}</h3>${b.ref?`<div class="ref">${esc(b.ref)}</div>`:""}<p>${esc(b.note)}</p>${b.url?`<a class="book" href="${esc(b.url)}" target="_blank" rel="noopener">Забронировать</a>`:""}${b.url2?`<a class="book" href="${esc(b.url2)}" target="_blank" rel="noopener">${esc(b.url2Label||"Ещё варианты")}</a>`:""}</div>
      <div class="price num">€${b.p}</div></div>`;
  }).join("");
  h += `<div class="total"><span>Куплено ${paid} из ${all}</span><b class="num">€${all-paid}</b></div>`;
  h += `<p class="sec">Красным — то, что разбирают: голуэйские туры, Гиннесс и Книга Келлса.</p>`;
  return h;
}

function stayView(){
  let h = `<div class="dayhead"><h2>Жильё</h2><p>Номера броней жёлтым. Premier Inn оплачивается при заезде.</p></div>`;
  h += STAY.map(s => `<div class="row"><div class="grow">
    <h3>${esc(s.n)}</h3>${s.ref?`<div class="ref">${esc(s.ref)}</div>`:""}
    <p>${esc(s.d)}${s.inout?" · "+esc(s.inout):""}<br>${esc(s.note)}</p>
    ${mapLink(s.n + ", " + s.a, s.a)}</div>
    <div class="price num">€${s.p}</div></div>`).join("");
  h += `<div class="total"><span>Итого за четыре отеля</span>
    <b class="num">€${STAY.reduce((a,s)=>a+s.p,0)}</b></div>`;
  return h;
}

function noteView(){
  let h = `<div class="dayhead"><h2>Памятка</h2><p>То, что легко забыть на месте.</p></div>`;
  h += NOTES.map(([t,b]) => `<div class="panel"><h3>${t}</h3><p>${esc(b)}</p></div>`).join("");
  return h;
}

const zoom = document.getElementById("zoom");
function openZoom(){
  zoom.innerHTML = '<p>Яркость на максимум. Тап — закрыть.</p>' +
    TICKETS.imgs.map(src => `<img src="${src}" alt="Штрихкод">`).join("") +
    `<p>${esc(TICKETS.title)}<br>Не считали — назовите фамилию и бронь 1023692.</p>`;
  zoom.classList.add("on");
}
zoom.onclick = () => zoom.classList.remove("on");

function bindBoxes(){
  main.querySelectorAll(".ticket").forEach(el => el.onclick = openZoom);
  main.querySelectorAll(".box").forEach(btn => {
    btn.onclick = () => {
      const b = BOOK[+btn.dataset.i];
      if (b.done) return;
      checked[b.n] = !checked[b.n];
      persist(); render();
    };
  });
}

syncNav();
render();
} /* end initApp */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
