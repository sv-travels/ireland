const KEY = "ireland-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = u => btoa(String.fromCharCode(...new Uint8Array(u)));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
async function openWith(key){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, key, b64(D.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.salt), iterations:D.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) {
    try { const k = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]); await openWith(k); return; }
    catch(e){ try { localStorage.removeItem(KEY); } catch(_){} }
  }
  const f = document.getElementById("f"); f.hidden = false;
  f.onsubmit = async ev => {
    ev.preventDefault(); const err = document.getElementById("err"); err.textContent = "Проверяю…";
    try {
      const k = await derive(document.getElementById("pw").value);
      const raw = await crypto.subtle.exportKey("raw", k);
      await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, k, b64(D.data));
      try { localStorage.setItem(KEY, enc(raw)); } catch(e){}
      await openWith(k);
    } catch(e){ err.textContent = "Неверный пароль"; }
  };
})();
})();
